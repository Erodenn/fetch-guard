- url: https://en.wikipedia.org/wiki/Python_(programming_language)
  description: Wikipedia Python article
  timeout: 30
  max_words: 5000
  assertions:
    min_body_length: 1000
    links_count_min: 1
    fields:
      risk_level: OK
      edge_cases: null
      llms_txt_available: false

- url: https://www.bbc.com/news
  description: BBC News homepage
  timeout: 30
  assertions:
    min_body_length: 100

- url: http://nytimes.com
  description: NYTimes HTTP redirect
  timeout: 30
  assertions:
    url_changed: true

- url: https://example.com
  description: example.com minimal page
  timeout: 30
  allow_fetch_error: true

