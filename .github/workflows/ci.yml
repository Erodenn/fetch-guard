name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dependencies are resolved fresh on every install, so an upstream release can
  # break the published package without any commit here.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check fetch_guard/ tests/

      - name: Test
        run: pytest -q
