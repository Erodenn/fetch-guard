[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fetch-guard"
version = "1.4.1"
description = "Fetch URLs and return clean, LLM-ready markdown with metadata and prompt injection defense"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Owen Sterling", email = "owen@erodenn.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]

dependencies = [
    "requests",
    "beautifulsoup4",
    "trafilatura",
    "extruct",
    "mcp>=2,<3",
]

[project.scripts]
fetch-guard = "fetch_guard.server:main"
fetch-guard-cli = "fetch_guard.cli:main"

[project.optional-dependencies]
js = [
    "playwright",
]
dev = [
    "pytest",
    "ruff",
    "pyyaml",
    "mypy",
    "types-requests",
    "types-PyYAML",
]
[project.urls]
Homepage = "https://github.com/Erodenn/fetch-guard"
Repository = "https://github.com/Erodenn/fetch-guard"
Issues = "https://github.com/Erodenn/fetch-guard/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real network (excluded by default)",
    "js: requires Playwright for JS rendering",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["fetch_guard", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "T20",  # flake8-print: stdout is the MCP stdio transport
    "TID251",  # banned-api: module boundaries below
]

# ARCHITECTURAL CONSTRAINTS (unencodable -- enforce via code review / CLAUDE.md)
# - security/patterns.py is the single source of truth for injection patterns
# - JS rendering is explicit opt-in, never an automatic fallback
# - Anticipated tool failures raise the SDK's ToolError; anything else surfaces as a crash
# - The pipeline never touches the session salt; wrapping happens after run() returns

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fetch_guard.output".msg = "output/ is CLI-only formatting. The server and pipeline return result dicts; format in cli.py."

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20", "TID251"]  # assert, print and output/ imports are fine in tests
"fetch_guard/cli.py" = ["E402", "T20", "TID251"]  # imports after dependency check; CLI owns stdout and output/
"fetch_guard/__init__.py" = ["T20"]  # dependency-check message goes to stderr before exit
"fetch_guard/output/**/*.py" = ["TID251"]  # the banned package itself
"fetch_guard/server.py" = ["E402"]  # imports after dependency check
"fetch_guard/http/__init__.py" = ["A005"]  # http subpackage shadows stdlib — scoped under fetch_guard

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["fetch_guard"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",  # a suppression must name its error code
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
]

# No stubs published for these; silence per-module rather than weakening strict.
[[tool.mypy.overrides]]
module = ["extruct.*", "trafilatura.*", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
