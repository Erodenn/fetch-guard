[project]
name = "fetch-skill"
version = "0.9.0"
description = "Fetch URLs and return clean, LLM-ready markdown with metadata and prompt injection defense"
requires-python = ">=3.9"

dependencies = [
    "requests",
    "beautifulsoup4",
    "trafilatura",
    "extruct",
    "mcp",
]

[project.scripts]
fetch-mcp = "fetch.scripts.server:main"

[project.optional-dependencies]
js = [
    "playwright",
]
dev = [
    "pytest",
    "ruff",
]
skill-only = [
    "requests",
    "beautifulsoup4",
    "trafilatura",
    "extruct",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["fetch/scripts"]
addopts = "-m 'not live'"
markers = [
    "live: hits real network (excluded by default)",
    "js: requires Playwright for JS rendering",
]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["fetch/scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow assert in tests
"fetch/scripts/fetch.py" = ["E402"]  # imports after sys.path setup
"fetch/scripts/injection_guard.py" = ["E402"]  # imports after sys.path setup
"fetch/scripts/pipeline.py" = ["E402"]  # imports after sys.path setup
"fetch/scripts/server.py" = ["E402"]  # imports after sys.path setup
